<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — DriveEasy Rentals</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-loading">

<div id="siteNav"></div>

<main class="auth-wrap">
  <div class="auth-left">
    <h1>Start driving<br>in minutes.</h1>
    <p>Create a free account to book cars, track reservations and pay online.</p>
  </div>
  <div class="auth-right">
    <div class="auth-form-wrap">
      <div class="auth-logo"><i class="bi bi-car-front-fill" style="color:var(--brand)"></i> DriveEasy</div>

      <h2 class="auth-title">Create account</h2>
      <p class="auth-subtitle">Join DriveEasy and start booking.</p>

      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label" for="regFullName">Full Name</label>
          <input class="form-control" id="regFullName" name="fullName" placeholder="Enter your full name" autocomplete="name">
        </div>
        <div class="mb-3">
          <label class="form-label" for="regUsername">Username</label>
          <input class="form-control" id="regUsername" name="username" placeholder="Choose a username" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="regEmail">Email</label>
          <input type="email" class="form-control" id="regEmail" name="email" placeholder="Enter your email" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="regPhone">Phone</label>
          <input class="form-control" id="regPhone" name="phone" placeholder="+91 90000 00000" autocomplete="tel">
        </div>
        <div class="mb-4">
          <label class="form-label" for="regPassword">Password</label>
          <div class="password-field">
            <input type="password" class="form-control" id="regPassword" name="password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordField(this)" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button class="btn btn-brand w-100 py-2 mb-3" id="registerSubmitBtn">Create Account</button>
      </form>

      <div id="googleBlock" class="google-block d-none">
        <div class="auth-divider"><span>or</span></div>
        <div id="googleBtnHost" class="google-btn-host"></div>
        <p class="google-note">We'll create your DriveEasy account automatically.</p>
      </div>

      <p class="auth-swap">Already registered? <a href="login.html">Sign in instead</a></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/google-signin.js"></script>
<script src="js/pages/register.js"></script>
</body>
</html>
