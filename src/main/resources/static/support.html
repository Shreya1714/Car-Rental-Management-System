<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — DriveEasy Rentals</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-loading">

<div id="siteNav"></div>

<main class="container py-4">
  <div class="page-header">
    <h1>Support</h1>
    <p>Answers to the common questions, and a direct line to our team.</p>
  </div>

  <div class="row g-4 mb-5">
    <div class="col-lg-6">
      <div class="search-card">
        <div class="admin-form-title"><i class="bi bi-envelope" style="color:var(--brand)"></i>Contact Us</div>
        <form id="supportForm">
          <div class="mb-3">
            <label class="form-label" for="supportSubject">Subject</label>
            <select class="form-select" id="supportSubject" name="subject">
              <option>Booking issue</option>
              <option>Payment problem</option>
              <option>Car condition complaint</option>
              <option>Cancellation request</option>
              <option>Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="supportMessage">Message</label>
            <textarea class="form-control" id="supportMessage" name="message" rows="5" placeholder="Describe your issue…" required></textarea>
          </div>
          <button type="submit" class="btn-save" id="supportSubmitBtn">
            <i class="bi bi-send me-1"></i>Send Message
          </button>
        </form>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="search-card h-100">
        <div class="admin-form-title"><i class="bi bi-question-circle" style="color:var(--brand)"></i>FAQ</div>
        <div class="d-flex flex-column gap-3" id="faqList"></div>
      </div>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/support.js"></script>
</body>
</html>
