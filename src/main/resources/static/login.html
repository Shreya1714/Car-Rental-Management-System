<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — DriveEasy Rentals</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-loading">

<div id="siteNav"></div>

<main class="auth-wrap">
  <div class="auth-left">
    <h1>Rent the right car, every time !</h1>
    <p>Pick up where you left off — your reservations are waiting.</p>
  </div>
  <div class="auth-right">
    <div class="auth-form-wrap">
      <div class="auth-logo"><i class="bi bi-car-front-fill" style="color:var(--brand)"></i> DriveEasy</div>

      <h2 class="auth-title">Sign in</h2>
      <p class="auth-subtitle">Enter your details to manage your bookings.</p>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="loginUsername">Username</label>
          <input class="form-control" id="loginUsername" name="username" placeholder="Enter your username" required autocomplete="username" autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-field">
            <input type="password" class="form-control" id="loginPassword" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordField(this)" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="auth-hint mb-4">
          <i class="bi bi-info-circle"></i>
          Demo: <strong>admin</strong> / <strong>Admin@123</strong>
        </div>
        <button class="btn btn-brand w-100 py-2 mb-3" id="loginSubmitBtn">Log In</button>
      </form>

      <div id="googleBlock" class="google-block d-none">
        <div class="auth-divider"><span>or</span></div>
        <div id="googleBtnHost" class="google-btn-host"></div>
      </div>

      <p class="auth-swap">New to DriveEasy? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/google-signin.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
