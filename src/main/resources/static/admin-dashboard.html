<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — DriveEasy Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-loading">

<div id="siteNav"></div>

<main class="container py-4">
  <div class="page-header">
    <h1>Admin Console</h1>
    <p>Fleet health, revenue and reservations at a glance.</p>
  </div>

  <div class="row g-3 mb-4" id="fleetStats"></div>

  <div class="row g-3 mb-4" id="revenueStats"></div>

  <div class="row g-4">
    <div class="col-lg-7">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="section-heading mb-0"><i class="bi bi-clock-history"></i>Latest Bookings</div>
        <a href="admin-bookings.html" class="link-brand">View all <i class="bi bi-arrow-right"></i></a>
      </div>
      <div id="recentBookings"></div>
    </div>
    <div class="col-lg-5">
      <div class="section-heading mb-3"><i class="bi bi-lightning-charge"></i>Quick Actions</div>
      <div class="d-flex flex-column gap-2">
        <a href="admin-fleet.html?action=add" class="quick-action">
          <i class="bi bi-plus-circle"></i>
          <div><strong>Add a vehicle</strong><span>Expand the fleet inventory</span></div>
        </a>
        <a href="admin-fleet.html" class="quick-action">
          <i class="bi bi-car-front"></i>
          <div><strong>Manage fleet</strong><span>Edit rates, details or remove cars</span></div>
        </a>
        <a href="admin-customers.html" class="quick-action">
          <i class="bi bi-people"></i>
          <div><strong>Customer directory</strong><span>See spend and booking counts</span></div>
        </a>
        <a href="settings.html" class="quick-action">
          <i class="bi bi-gear"></i>
          <div><strong>Settings</strong><span>Change your admin password</span></div>
        </a>
      </div>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/admin-dashboard.js"></script>
</body>
</html>
