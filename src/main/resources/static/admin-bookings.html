<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings — DriveEasy Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-loading">

<div id="siteNav"></div>

<main class="container py-4">
  <div class="page-header">
    <h1>All Bookings</h1>
    <p>The complete reservation archive across every customer.</p>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-3" id="statusChips">
    <button class="filter-chip active" data-status="ALL">All</button>
    <button class="filter-chip" data-status="PENDING">Pending</button>
    <button class="filter-chip" data-status="CONFIRMED">Confirmed</button>
    <button class="filter-chip" data-status="CANCELLED">Cancelled</button>
    <button class="filter-chip" data-status="COMPLETED">Completed</button>
  </div>

  <div id="bookingsTable"></div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/admin-bookings.js"></script>
</body>
</html>
