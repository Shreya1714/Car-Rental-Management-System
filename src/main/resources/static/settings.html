<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — DriveEasy Rentals</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-loading">

<div id="siteNav"></div>

<main class="container py-4" style="max-width:640px">
  <div class="page-header">
    <h1>Settings</h1>
    <p>Manage your account.</p>
  </div>

  <div class="search-card mb-4">
    <div class="admin-form-title"><i class="bi bi-person-badge" style="color:var(--brand)"></i>Account</div>
    <div class="account-row"><span>Username</span><strong id="acctUsername">—</strong></div>
    <div class="account-row"><span>Role</span><strong id="acctRole">—</strong></div>
  </div>

  <div class="search-card">
    <div class="admin-form-title"><i class="bi bi-key" style="color:var(--brand)"></i>Change Password</div>
    <form id="changePasswordForm">
      <div class="mb-3">
        <label class="form-label" for="currentPassword">Current Password</label>
        <div class="password-field">
          <input type="password" class="form-control" id="currentPassword" name="currentPassword" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordField(this)" aria-label="Show password"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="newPassword">New Password</label>
        <div class="password-field">
          <input type="password" class="form-control" id="newPassword" name="newPassword" minlength="6" required autocomplete="new-password">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordField(this)" aria-label="Show password"><i class="bi bi-eye"></i></button>
        </div>
        <div class="form-hint">At least 6 characters.</div>
      </div>
      <button type="submit" class="btn-save w-100" id="changePasswordBtn">
        <i class="bi bi-check-lg me-1"></i>Update Password
      </button>
    </form>
  </div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/settings.js"></script>
</body>
</html>
