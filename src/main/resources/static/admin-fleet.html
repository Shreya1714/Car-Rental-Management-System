<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet — DriveEasy Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-loading">

<div id="siteNav"></div>

<main class="container py-4">
  <div class="page-header">
    <h1>Fleet Management</h1>
    <p>Add vehicles, adjust daily rates and retire cars from the fleet.</p>
  </div>

  <div class="row g-4">
    <div class="col-lg-4">
      <div class="admin-form-card sticky-form">
        <div class="admin-form-title" id="carFormTitle">
          <i class="bi bi-plus-circle" style="color:var(--brand)"></i>Add a Car
        </div>
        <form id="carForm">
          <input type="hidden" name="id">
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label" for="carType">Type</label>
              <select class="form-select" id="carType" name="type" required>
                <option value="SUV">SUV</option>
                <option value="SEDAN">Sedan</option>
                <option value="TRAVELLER">Traveller</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label" for="carModel">Model</label>
              <input class="form-control" id="carModel" name="model" placeholder="e.g. Toyota Innova" required>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label" for="carReg">Registration No.</label>
            <input class="form-control" id="carReg" name="registrationNumber" placeholder="MH12AB1234" required>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label" for="carSeats">Seats</label>
              <input type="number" min="1" class="form-control" id="carSeats" name="seats" placeholder="5" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="carRate">Daily Rate (Rs.)</label>
              <input type="number" min="1" step="1" class="form-control" id="carRate" name="dailyRate" placeholder="2500" required>
            </div>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label" for="carFuel">Fuel</label>
              <select class="form-select" id="carFuel" name="fuelType">
                <option value="">— Select —</option>
                <option value="Petrol">Petrol</option>
                <option value="Diesel">Diesel</option>
                <option value="Electric">Electric</option>
                <option value="Hybrid">Hybrid</option>
                <option value="CNG">CNG</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label" for="carTransmission">Transmission</label>
              <select class="form-select" id="carTransmission" name="transmission">
                <option value="">— Select —</option>
                <option value="Automatic">Automatic</option>
                <option value="Manual">Manual</option>
                <option value="CVT">CVT</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="carImage">Image URL</label>
            <input class="form-control" id="carImage" name="imageUrl" placeholder="https://…">
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn-save" id="carFormSubmitBtn">
              <i class="bi bi-floppy me-1"></i>Save Vehicle
            </button>
            <button type="button" class="btn-cancel-form d-none" id="carFormCancelBtn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="section-heading mb-0"><i class="bi bi-car-front"></i>Current Inventory</div>
        <span class="results-count" id="fleetCount"></span>
      </div>
      <div class="row g-3" id="carGrid"></div>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/admin-fleet.js"></script>
</body>
</html>
