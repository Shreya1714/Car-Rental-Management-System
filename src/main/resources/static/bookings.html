<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reservations — DriveEasy Rentals</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-loading">

<div id="siteNav"></div>

<main class="container py-4">
  <div class="page-header">
    <h1>My Reservations</h1>
    <p>Pay for pending bookings, or cancel plans that have changed.</p>
  </div>

  <div class="row g-3 mb-4" id="bookingStats"></div>

  <div class="d-flex flex-wrap gap-2 mb-3" id="statusChips">
    <button class="filter-chip active" data-status="ALL">All</button>
    <button class="filter-chip" data-status="PENDING">Pending Payment</button>
    <button class="filter-chip" data-status="CONFIRMED">Confirmed</button>
    <button class="filter-chip" data-status="CANCELLED">Cancelled</button>
  </div>

  <div id="myBookings"></div>
</main>

<!-- PAYMENT MODAL -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:420px">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-lock-fill me-2" style="color:var(--brand)"></i>Secure Payment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted mb-4" style="font-size:.875rem">Choose your preferred payment method to confirm the booking.</p>
        <div class="d-flex flex-column gap-2" id="paymentMethodBtns">
          <button class="pay-method-btn" data-method="CARD">
            <i class="bi bi-credit-card-2-front"></i>
            <span class="pm-label">Credit / Debit Card</span>
            <i class="bi bi-chevron-right pm-arrow"></i>
          </button>
          <button class="pay-method-btn" data-method="UPI">
            <i class="bi bi-phone"></i>
            <span class="pm-label">UPI</span>
            <i class="bi bi-chevron-right pm-arrow"></i>
          </button>
          <button class="pay-method-btn" data-method="NETBANKING">
            <i class="bi bi-building"></i>
            <span class="pm-label">Net Banking</span>
            <i class="bi bi-chevron-right pm-arrow"></i>
          </button>
        </div>
        <div id="paymentProcessing" class="text-center py-3 d-none">
          <div class="spinner-border text-danger mb-2" style="width:2rem;height:2rem;" role="status"></div>
          <p class="text-muted mb-0" style="font-size:.875rem">Processing your payment…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/bookings.js"></script>
</body>
</html>
