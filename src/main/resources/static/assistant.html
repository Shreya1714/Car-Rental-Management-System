<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant — DriveEasy Rentals</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="page-loading">

<div id="siteNav"></div>

<main class="container py-4">
  <div class="page-header">
    <h1>AI Assistant</h1>
    <p>Describe your trip and get a shortlist, or ask a question in the chat bubble.</p>
  </div>

  <div class="row g-4">
    <div class="col-lg-5">
      <div class="ai-card">
        <div class="d-flex align-items-center gap-2 mb-1">
          <i class="bi bi-stars" style="color:var(--brand);font-size:1.1rem"></i>
          <span style="font-weight:800;font-size:1rem">Trip Details</span>
        </div>
        <p class="mb-3" style="font-size:.82rem;color:rgba(255,255,255,.6)">
          Tell us about the trip and we'll rank the fleet for you.
        </p>
        <form id="recommendForm">
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label" for="passengers">Passengers</label>
              <input type="number" min="1" class="form-control" id="passengers" name="passengers" placeholder="e.g. 4">
            </div>
            <div class="col-6">
              <label class="form-label" for="budgetPerDay">Budget/day (Rs.)</label>
              <input type="number" min="1" class="form-control" id="budgetPerDay" name="budgetPerDay" placeholder="e.g. 3000">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="tripType">Trip Type</label>
            <select class="form-select" id="tripType" name="tripType">
              <option value="CITY">City Commute</option>
              <option value="OUTSTATION">Outstation</option>
              <option value="GROUP">Group Travel</option>
              <option value="LUGGAGE_HEAVY">Luggage-Heavy</option>
            </select>
          </div>
          <button type="submit" class="btn-ai" id="recommendBtn">
            <i class="bi bi-stars me-1"></i>Get AI Picks
          </button>
        </form>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="section-heading mb-3"><i class="bi bi-trophy"></i>Your Shortlist</div>
      <div id="recommendResults">
        <div class="empty-state">
          <i class="bi bi-stars"></i>
          <p>Fill in your trip details and we'll suggest the best matches.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/assistant.js"></script>
</body>
</html>
