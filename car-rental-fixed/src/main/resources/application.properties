# ==== Server ====
server.port=8080

# ==== Database (file-based H2 => data survives restarts = "archived" data) ====
spring.datasource.url=jdbc:h2:file:./data/carrentaldb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==== JWT ====
# Change this secret before deploying to production.
app.jwt.secret=ChangeThisSecretKeyForProductionUseSomethingLongAndRandom123456789
app.jwt.expiration-ms=86400000

# ==== AI Assistant (Claude) ====
# Optional. If left blank, the AI assistant falls back to a built-in
# rule-based responder so the app still works end-to-end without a key.
app.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic-model=claude-sonnet-4-6

# ==== Misc ====
spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.rental=INFO
