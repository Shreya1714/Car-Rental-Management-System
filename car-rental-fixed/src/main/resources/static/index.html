<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriveEasy Rentals</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <i class="bi bi-car-front-fill" style="color:var(--brand)"></i>
      DriveEasy Rentals
    </a>
    <div class="d-none d-md-flex align-items-center gap-4" id="navLinks"></div>
    <div class="d-flex align-items-center gap-2" id="navRight"></div>
  </div>
</nav>

<!-- MAIN APP -->
<div id="app"></div>

<!-- PAYMENT MODAL -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:420px">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-lock-fill me-2" style="color:var(--brand)"></i>Secure Payment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted mb-4" style="font-size:.875rem">Choose your preferred payment method to confirm the booking.</p>
        <div class="d-flex flex-column gap-2" id="paymentMethodBtns">
          <button class="pay-method-btn" data-method="CARD">
            <i class="bi bi-credit-card-2-front"></i>
            <span class="pm-label">Credit / Debit Card</span>
            <i class="bi bi-chevron-right pm-arrow"></i>
          </button>
          <button class="pay-method-btn" data-method="UPI">
            <i class="bi bi-phone"></i>
            <span class="pm-label">UPI</span>
            <i class="bi bi-chevron-right pm-arrow"></i>
          </button>
          <button class="pay-method-btn" data-method="NETBANKING">
            <i class="bi bi-building"></i>
            <span class="pm-label">Net Banking</span>
            <i class="bi bi-chevron-right pm-arrow"></i>
          </button>
        </div>
        <div id="paymentProcessing" class="text-center py-3 d-none">
          <div class="spinner-border text-danger mb-2" style="width:2rem;height:2rem;" role="status"></div>
          <p class="text-muted mb-0" style="font-size:.875rem">Processing your payment…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- AI CHAT WIDGET -->
<div id="chatWidget" class="d-none">
  <div id="chatPanel" class="chat-panel d-none">
    <div class="chat-header">
      <div class="d-flex align-items-center gap-2">
        <span class="chat-avatar"><i class="bi bi-robot"></i></span>
        <div>
          <div class="chat-title">AI Assistant</div>
          <div class="chat-subtitle">Powered by DriveEasy</div>
        </div>
      </div>
      <button class="btn-close btn-close-white" id="chatCloseBtn" style="font-size:.75rem"></button>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="chat-row bot">
        <span class="chat-bubble-avatar"><i class="bi bi-robot"></i></span>
        <div class="chat-msg bot">Hi! Ask me things like "cheapest car available" or "SUV for a family of 6 going outstation".</div>
      </div>
    </div>
    <div class="chat-input">
      <input type="text" id="chatInput" class="form-control" placeholder="Type a message…">
      <button class="chat-send-btn" id="chatSendBtn"><i class="bi bi-send-fill"></i></button>
    </div>
  </div>
  <button id="chatToggleBtn" class="chat-fab"><i class="bi bi-chat-dots-fill"></i></button>
</div>

<div id="toastHost" class="toast-host"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
